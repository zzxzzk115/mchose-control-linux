[package]
name = "mchose"
version = "0.3.1"
edition = "2021"
description = "MCHOSE Control Linux: mouse settings, application presets and desktop integration"
license = "MIT"
repository = "https://github.com/zzxzzk115/mchose-control-linux"
readme = "README.md"

[dependencies]
libc = "0.2"

[dependencies.eframe]
version = "0.36"
optional = true
default-features = false
features = ["default_fonts", "glow", "wayland", "x11"]

[features]
gui = ["dep:eframe"]

[[bin]]
name = "mchose"
path = "src/main.rs"

[[bin]]
name = "mchose-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[profile.release]
strip = true
opt-level = 2
lto = true
